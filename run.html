<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جلسهٔ تست</title>
<link rel="stylesheet" href="./assets/app.css">
<style>
  /* The runner deliberately has no platform chrome. The participant should
     be looking at the product under test, not at our navigation. */
  body{background:var(--canvas)}
  .stage{min-height:100vh;display:flex;flex-direction:column}
  .runbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--canvas) 90%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .runbar .in{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
  .runbar .step{font-size:12px;color:var(--ink-2);font-weight:500;flex:none}
  .runbar .prog{flex:1;max-width:340px}
  .pane{flex:1;display:flex;gap:26px;max-width:1180px;margin:0 auto;padding:22px;width:100%;
    align-items:flex-start}
  @media(max-width:940px){.pane{flex-direction:column;align-items:stretch}}
  .side{flex:1;min-width:0;max-width:520px}
  @media(max-width:940px){.side{max-width:none;order:2}}
  .devwrap{flex:none;display:flex;justify-content:center}
  @media(max-width:940px){.devwrap{order:1}}
  .taskcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:22px;box-shadow:var(--sh)}
  .thinkaloud{display:flex;align-items:center;gap:9px;margin-top:14px;padding:11px 14px;
    background:var(--brand-soft);border-radius:var(--r-md);font-size:12px;color:var(--brand-ink);
    font-weight:500}
  .qblock{margin-bottom:22px}
  .qblock .qt{font-size:14.5px;font-weight:600;line-height:1.6;margin-bottom:11px}
  .qblock .qt .n{color:var(--ink-3);font-weight:500;margin-inline-end:5px}
  .center{max-width:620px;margin:0 auto;padding:46px 22px}
  .bigcode{font-size:30px;font-weight:700;letter-spacing:.04em;text-align:center;
    padding:18px;background:var(--surface-2);border-radius:var(--r-md);margin:14px 0}
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script src="./assets/app.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   PARTICIPANT RUNNER
   Five phases: welcome → screener → tasks → post questions → done.
   Screening happens BEFORE anyone spends time, which is the entire point:
   an unqualified participant costs a 40-minute session and then poisons
   the findings. Rejection is polite, immediate, and recorded.
   ═══════════════════════════════════════════════════════════════════ */
/* The runner shows no platform navigation, but it still follows the
   viewer's light/dark setting — otherwise the frame renders light while
   the prototype inside it goes dark, which just looks broken. */
App.initTheme();

let S = null, sess = null, phase = 'welcome', ti = 0, taskStart = 0;

const stage = App.$('stage');
const RX = () => App.qs('skip') === '1';

(async function init(){
  const id = App.qs('id');
  S = id ? await App.loadStudy(id) : null;
  if (!S) { stage.innerHTML = `<div class="center"><h2>این جلسه در دسترس نیست</h2>
    <p class="lead" style="margin-top:8px">لینک را دوباره از تسهیل‌گر بگیرید.</p></div>`; return; }
  document.title = S.name + ' · جلسهٔ تست';
  sess = App.newSession(S.id, App.qs('mode') || 'unmoderated');
  render();
})();

function bar(pct, label){
  return `<div class="runbar"><div class="in">
    <span class="step">${label}</span>
    <div class="prog"><i style="width:${pct}%"></i></div>
  </div></div>`;
}

function device(){
  const w = S.settings?.deviceWidth || 390, h = S.settings?.deviceHeight || 844;
  const vw = Math.min(w, 360);
  const vh = Math.round(vw * (h / w));
  return `<div class="devwrap"><div class="device">
    <iframe id="proto" src="${App.esc(S.prototypeUrl)}" width="${vw}" height="${vh}"
      title="پروتوتایپ" allow="clipboard-write"></iframe>
  </div></div>`;
}

/* ── phase: welcome ─────────────────────────────────────────────── */
function render(){
  if (phase === 'welcome')  return welcome();
  if (phase === 'screener') return screener();
  if (phase === 'rejected') return rejected();
  if (phase === 'tasks')    return tasks();
  if (phase === 'post')     return post();
  if (phase === 'done')     return done();
}

function welcome(){
  stage.innerHTML = bar(4, 'شروع') + `<div class="center">
    <span class="badge b-mute">${App.esc(S.product || '')}</span>
    <h1 style="margin:12px 0 14px;font-size:27px">ممنون که وقت گذاشتید.</h1>
    <p class="lead">${App.esc(S.intro || '')}</p>
    <div class="note" style="margin-top:18px">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <p><b>ما تجربه را تست می‌کنیم، نه شما را.</b> جواب درست و غلطی وجود ندارد.
        هر جا در واقعیت متوقف می‌شدید، اینجا هم متوقف شوید و بگویید چرا.</p>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:20px" onclick="startRun()">شروع</button>
    <p class="tiny" style="text-align:center;margin-top:10px">
      کد جلسهٔ شما: <b class="en">${sess.code}</b></p>
  </div>`;
}
window.startRun = () => {
  phase = (RX() || !S.screener?.questions?.length) ? 'tasks' : 'screener';
  if (phase === 'tasks') { sess.screener.qualified = null; taskStart = Date.now(); }
  render();
};

/* ── phase: screener ────────────────────────────────────────────── */
function screener(){
  const qs = S.screener.questions;
  stage.innerHTML = bar(16, 'چند سؤال کوتاه') + `<div class="center">
    <h2>پیش از شروع</h2>
    <p class="lead" style="margin:8px 0 22px">${App.esc(S.screener.intro || '')}</p>
    <div id="qs">${qs.map((q, i) => qBlock(q, i)).join('')}</div>
    <button class="btn btn-primary btn-block" id="sc-cta" onclick="submitScreener()">ادامه</button>
    <p class="tiny" style="text-align:center;margin-top:10px">همهٔ سؤال‌های ستاره‌دار لازم است.</p>
  </div>`;
  wireChoices();
}

function qBlock(q, i){
  const n = `<span class="n num">${App.fa(i + 1)}.</span>`;
  const req = q.required ? ' <span style="color:var(--bad)">*</span>' : '';
  let body = '';
  if (q.type === 'text') {
    body = `<textarea class="input" data-q="${q.id}" rows="3" placeholder="…"></textarea>`;
  } else if (q.type === 'number') {
    body = `<input class="input num" type="number" data-q="${q.id}">`;
  } else {
    const multi = q.type === 'multi';
    body = (q.options || []).map((o, oi) =>
      `<button class="choice${multi ? ' sq' : ''}" aria-pressed="false"
         data-q="${q.id}" data-oi="${oi}" data-multi="${multi}">
        <span class="mark"></span><span class="lbl">${App.esc(o.label)}</span>
      </button>`).join('');
    if (multi) body += `<p class="tiny">می‌توانید چند گزینه انتخاب کنید.</p>`;
  }
  return `<div class="qblock" data-qid="${q.id}">
    <div class="qt">${n}${App.esc(q.text)}${req}</div>${body}</div>`;
}

function wireChoices(){
  App.$$('.choice').forEach(b => b.onclick = () => {
    const multi = b.dataset.multi === 'true';
    if (!multi) App.$$(`.choice[data-q="${b.dataset.q}"]`).forEach(o =>
      o.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', multi
      ? String(b.getAttribute('aria-pressed') !== 'true') : 'true');
  });
}

function readAnswers(list){
  const out = {};
  for (const q of list) {
    if (q.type === 'text' || q.type === 'number') {
      const n = document.querySelector(`[data-q="${q.id}"]`);
      out[q.id] = n ? n.value.trim() : '';
    } else {
      const picked = App.$$(`.choice[data-q="${q.id}"][aria-pressed="true"]`)
        .map(b => +b.dataset.oi);
      out[q.id] = q.type === 'multi' ? picked : (picked.length ? picked[0] : null);
    }
  }
  return out;
}

function missing(list, answers){
  return list.filter(q => {
    if (!q.required) return false;
    const v = answers[q.id];
    return v === '' || v === null || v === undefined || (Array.isArray(v) && !v.length);
  });
}

window.submitScreener = () => {
  const qs = S.screener.questions;
  const answers = readAnswers(qs);
  const miss = missing(qs, answers);
  if (miss.length) {
    const first = document.querySelector(`[data-qid="${miss[0].id}"]`);
    first?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    App.$('sc-cta').textContent = 'به ' + App.fa(miss.length) + ' سؤال جواب نداده‌اید';
    setTimeout(() => App.$('sc-cta').textContent = 'ادامه', 2200);
    return;
  }
  /* Scoring: any disqualifying option is absolute; otherwise the sum of the
     chosen options' scores must clear passScore. Both the number and the
     reason are stored, so a rejection can be audited later. */
  let score = 0; const reasons = [];
  for (const q of qs) {
    const v = answers[q.id];
    const idxs = Array.isArray(v) ? v : (v === null ? [] : [v]);
    for (const i of idxs) {
      const o = q.options?.[i]; if (!o) continue;
      score += (o.score || 0);
      if (o.disqualify) reasons.push(q.text + ' → ' + o.label);
    }
  }
  const pass = reasons.length === 0 && score >= (S.screener.passScore ?? 0);
  sess.screener = { answers, score, qualified: pass, reasons };
  App.saveSession(sess);
  phase = pass ? 'tasks' : 'rejected';
  if (pass) taskStart = Date.now();
  render();
};

function rejected(){
  stage.innerHTML = bar(100, 'پایان') + `<div class="center" style="text-align:center">
    <h2>ممنون از وقتی که گذاشتید.</h2>
    <p class="lead" style="margin:10px auto 0">
      این جلسهٔ خاص دنبال تجربهٔ متفاوتی است، بنابراین اینجا متوقف می‌شویم.
      این هیچ ربطی به جواب‌های شما ندارد — فقط تطابق با این مطالعهٔ مشخص است.</p>
    <p class="tiny" style="margin-top:16px">کد: <b class="en">${sess.code}</b></p>
  </div>`;
  finish(false);
}

/* ── phase: tasks ───────────────────────────────────────────────── */
function tasks(){
  const t = S.tasks[ti];
  const pct = 20 + Math.round((ti / Math.max(1, S.tasks.length)) * 55);
  stage.innerHTML = bar(pct, `تسک ${App.fa(ti + 1)} از ${App.fa(S.tasks.length)}`) + `
    <div class="pane">
      <div class="side">
        <div class="taskcard">
          <span class="badge b-brand">تسک ${App.fa(ti + 1)}</span>
          <h2 style="margin:11px 0 8px">${App.esc(t.title)}</h2>
          <p class="lead" style="font-size:14px">${App.esc(t.prompt)}</p>
          <div class="thinkaloud">
            <span class="dot"></span>بلند فکر کنید — هر چیزی که از ذهنتان می‌گذرد.
          </div>
          <div class="field" style="margin-top:18px">
            <label>اگر چیزی اینجا گیجتان کرد یا متوقفتان کرد، بنویسید</label>
            <textarea class="input" id="t-note" rows="3" placeholder="اختیاری"></textarea>
          </div>
          <div class="field">
            <label>این تسک را توانستید انجام دهید؟</label>
            <div class="chipset" id="t-out">
              <button class="chip" data-v="done">بله</button>
              <button class="chip" data-v="partial">تا حدی</button>
              <button class="chip" data-v="stuck">نه، گیر کردم</button>
              <button class="chip" data-v="wouldnt">در واقعیت ادامه نمی‌دادم</button>
            </div>
          </div>
          <button class="btn btn-primary btn-block" style="margin-top:6px" onclick="nextTask()">
            ${ti + 1 < S.tasks.length ? 'تسک بعدی' : 'ادامه به سؤال‌های پایانی'}</button>
        </div>
      </div>
      ${device()}
    </div>`;
  App.$$('#t-out .chip').forEach(c => c.onclick = () => {
    App.$$('#t-out .chip').forEach(o => o.setAttribute('aria-pressed', 'false'));
    c.setAttribute('aria-pressed', 'true');
  });
  taskStart = Date.now();
}

window.nextTask = () => {
  const t = S.tasks[ti];
  const picked = document.querySelector('#t-out .chip[aria-pressed="true"]');
  sess.tasks.push({
    id: t.id, title: t.title, hypothesis: t.hypothesis,
    ms: Date.now() - taskStart,
    outcome: picked ? picked.dataset.v : null,
    note: App.$('t-note').value.trim()
  });
  App.saveSession(sess);
  ti++;
  if (ti >= S.tasks.length) { phase = 'post'; }
  render();
  scrollTo(0, 0);
};

/* ── phase: post questions ──────────────────────────────────────── */
function post(){
  const qs = S.postQuestions || [];
  stage.innerHTML = bar(88, 'چند سؤال پایانی') + `<div class="center">
    <h2>بعد از دیدن این تجربه</h2>
    <p class="lead" style="margin:8px 0 22px">هرچه صریح‌تر بهتر. نقد به ما بیشتر کمک می‌کند تا تعارف.</p>
    <div id="qs">${qs.map((q, i) => qBlock(q, i)).join('')}</div>
    <button class="btn btn-primary btn-block" id="pq-cta" onclick="submitPost()">پایان جلسه</button>
  </div>`;
  wireChoices();
}

window.submitPost = () => {
  const qs = S.postQuestions || [];
  const answers = readAnswers(qs);
  const miss = missing(qs, answers);
  if (miss.length) {
    document.querySelector(`[data-qid="${miss[0].id}"]`)
      ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    App.$('pq-cta').textContent = 'به ' + App.fa(miss.length) + ' سؤال جواب نداده‌اید';
    setTimeout(() => App.$('pq-cta').textContent = 'پایان جلسه', 2200);
    return;
  }
  sess.answers = answers;
  phase = 'done'; render(); finish(true);
};

/* ── phase: done ────────────────────────────────────────────────── */
function done(){
  stage.innerHTML = bar(100, 'تمام') + `<div class="center" style="text-align:center">
    <h2>تمام شد — ممنون.</h2>
    <p class="lead" style="margin:10px auto 0">
      یک قدم آخر: کد زیر را برای تسهیل‌گر بفرستید تا جواب‌های شما ثبت شود.</p>
    <div class="bigcode en">${sess.code}</div>
    <div class="row-btns" style="justify-content:center">
      <button class="btn btn-primary" onclick="cpRes()">کپی نتیجهٔ جلسه</button>
      <button class="btn btn-line" onclick="dlRes()">دانلود فایل</button>
    </div>
    <p class="tiny" style="margin-top:14px">
      نتیجه فقط در همین مرورگر ذخیره شده است. اگر آن را نفرستید، جایی ثبت نمی‌شود.</p>
    <p id="sent" class="tiny" style="margin-top:6px"></p>
  </div>`;
}
window.cpRes = async () => {
  const ok = await App.copy(JSON.stringify(sess));
  App.$('sent').textContent = ok ? 'در حافظه کپی شد — برای تسهیل‌گر بفرستید.' : 'کپی نشد؛ از دکمهٔ دانلود استفاده کنید.';
};
window.dlRes = () => App.download(sess.studyId + '.' + sess.code + '.json', JSON.stringify(sess, null, 2));

async function finish(completed){
  sess.endedAt = new Date().toISOString();
  sess.completed = completed;
  App.saveSession(sess);
  const hook = S.settings?.webhook;
  if (hook) {
    const r = await App.postWebhook(hook, sess);
    const n = App.$('sent');
    if (n && r.sent) n.textContent = 'نتیجه برای تیم ارسال شد ✓';
  }
}
</script>
</body>
</html>
